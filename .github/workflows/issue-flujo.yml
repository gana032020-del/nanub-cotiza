name: Flujo de issues
on:
  issues:
    types: [opened, reopened, closed]
permissions:
  issues: write
  contents: read
jobs:
  triage:
    if: github.event.action == 'opened' || github.event.action == 'reopened'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;
            const text = `${issue.title || ''}\n${issue.body || ''}`.toLowerCase();
            const labels = new Set(['triage']);
            if (/bug|error|falla|roto/.test(text)) labels.add('bug');
            if (/caja|cobro|pago|precio|factura|cotiz/.test(text)) labels.add('caja');
            if (/\bp0\b|urgente|bloquea/.test(text)) labels.add('p0');
            else if (/\bp1\b/.test(text)) labels.add('p1');
            else labels.add('p2');
            await github.rest.issues.addLabels({owner: context.repo.owner, repo: context.repo.repo, issue_number: issue.number, labels: [...labels]});
            try { await github.rest.issues.addAssignees({owner: context.repo.owner, repo: context.repo.repo, issue_number: issue.number, assignees: [context.repo.owner]}); } catch (e) {}
            const existing = await github.rest.issues.listComments({owner: context.repo.owner, repo: context.repo.repo, issue_number: issue.number});
            if (!existing.data.some(c => (c.body || '').includes('Triage automático'))) {
              await github.rest.issues.createComment({owner: context.repo.owner, repo: context.repo.repo, issue_number: issue.number, body: '## Triage automático\n\nQuita `triage` y pon `ready` cuando se pueda ejecutar.\n\n_Flujo Nanub — Angel Nandi_'});
            }
  cerrado:
    if: github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            for (const name of ['triage','ready','blocked']) {
              try { await github.rest.issues.removeLabel({owner: context.repo.owner, repo: context.repo.repo, issue_number: context.payload.issue.number, name}); } catch (e) {}
            }
